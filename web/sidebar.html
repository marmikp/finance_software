<body  ng-app="myApp" ng-controller="customersCtrl">
    <div class="wrapper">
        <div class="sidebar" data-color="purple" data-image="{{ url_for('static', filename='assets/img/sidebar-1.jpg')}}">
    <div class="logo">
                <a href="/" class="simple-text">
                 <img src="{{ url_for('static', filename='assets/img/sutc.png')}}">
                </a>
            </div>
            <div class="sidebar-wrapper">
                <ul class="nav" id="nav">
                    <li id="loan">
                        <a href="/api/hafta">
                            <i class="far fa-credit-card"></i>
                            <p>Loan</p>
                        </a>
                    </li>
                    <li id="account">
                        <a href="/api/account">
                            <i class="far fa-credit-card"></i>
                            <p>Account</p>
                        </a>
                    </li>
                    <li id="debit_accounts">
                        <a href="/api/debit_account">
                            <i class="far fa-credit-card"></i>

                        </a>
                    </li>
                    <li id="report">
                        <a href="/api/report">
                            <i class="fas fa-shopping-cart"></i>
                            <p>Report</p>
                        </a>
                    </li>

                    <li class="active-pro">
                        <a href="http://www.blackqr.in">

                            <p><center>BLACKQR</center></p>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="main-panel">

                    <div class="navbar-header">
                        <button type="button" class="navbar-toggle" data-toggle="collapse">

                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                        </button>

                    </div>

                </div>
            </nav>
                <div class="main_content">
                    {{data}}

                </div>

        </div>
    </div>
