<script>
$(document).ready(function(){
  $('#loanNo').change(function() {
    var loanNo = document.getElementById("loanNo").value;
    $.post('/api/hafta/add_collection_user_info', {'lenar': loanNo},
            function(returnedData){
                $('.data_table').html(returnedData['table']);
                $('#name').val(returnedData['name']);
                $('#user_id').val(returnedData['user_id']);


        }).fail(function(){
              console.log("error");
        });
  });

  $(".extend_hafta").click(function(){
    if (confirm("Press OK to Extend hafta")){
        var amount = document.getElementById("amount").value;
        var months = document.getElementById("addmonth").value;
        var loan_id = document.getElementById("loanNo").value;
        var user_id = document.getElementById("user_id").value;
        $.post('/api/test', {'url': 'http://127.0.0.1:5000/api/hafta/extend_hafta', 'user_id': user_id,
                                'loan_id': loan_id, 'amount': amount, 'months': months},
                function(returnedData){
                    alert(returnedData['status']);
            }).fail(function(){
                  console.log("error");
            });

    }
  });
});

</script>
