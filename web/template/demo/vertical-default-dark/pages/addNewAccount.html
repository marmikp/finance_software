<script>
$(document).ready(function(){
    $(".btnRegister").click(function(){
    var id = document.getElementById('id').value;
    var name = document.getElementById('name').value;
    var alias = document.getElementById('alias').value;
    var address = document.getElementById('address').value;
    var city = document.getElementById('city').value;
    var phone = document.getElementById('phone').value;
    var remark = document.getElementById('remark').value;
    var base_amount = document.getElementById('base_amount').value;
    var startdate = document.getElementById('startdate').value;


    $.post('/api/account/new_account_entry', {'id': id, 'name': name, 'alias': alias, 'address': address, 'phone': phone,
                                        'city': city, 'remark': remark, 'base_amount': base_amount,'startdate': startdate},
            function(returnedData){
            console.log(returnedData);
                if (returnedData.code == 200){
                    alert("Entry Added!!");
                    location.reload();

                }

        }).fail(function(){
              console.log("error");
        });
  });

  $("#ok").click(function(){
    $('.register-form').show();
    $('.bb').hide();
    $('.message').hide();
    $('.check').hide();
    location.reload();
  });

  });



</script>
