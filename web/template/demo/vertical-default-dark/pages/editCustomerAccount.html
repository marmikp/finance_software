<body>
<div class="container-scroller">
    <div class="container-fluid page-body-wrapper">
        <div class="main-panel" style="width: 100%">
            <div class="content-wrapper" style="padding: 0px;">
                <div class="page-title-box">
                    <!--<h2>Collection</h2> -->
                </div>

                <div class="row">

                    <div class="col-md-12 grid-margin stretch-card">
                        <div class="card card-box">
                            <div class="card-body">
                                <!-- <h4 class="card-title">Horizontal Form</h4> -->
                                <!-- <p class="card-description"> -->
                                <!-- Horizontal form layout -->
                                <!-- </p> -->
                                <form class="forms-sample custom-form ">
                                    <div class="form-group row" style="margin-bottom: 0px;">
                                        <input type="hidden" class="form-control" name="id" value="{{data.id}}" id="id"/>
                                        <label for="name" class=" col-sm-3  col-form-label">Name</label>
                                        <div class="col-sm-6">

                                            <input type="text" class="form-control" id="name" name="name" placeholder=""
                                                   value="{{data.user_name if 'user_name' in data.keys() else ''}}">


                                        </div>
                                    </div>
                                    <div class="form-group row" style="margin-bottom: 0px;">
                                        <label for="address" class=" col-sm-3  col-form-label">Alias</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" id="alias" name="alias" value="{{data.user_alias if 'user_alias' in data.keys() else ''}}" placeholder="Short Name">
                                        </div>
                                    </div>
                                    <div class="form-group row" style="margin-bottom: 0px;">
                                        <label for="address" class=" col-sm-3  col-form-label">Address</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" id="address" name="address" value="{{data.user_address if 'user_address' in data.keys() else ''}}" placeholder="Address">
                                        </div>
                                    </div>
                                    <div class="form-group row" style="margin-bottom: 0px;">
                                        <label for="city" class=" col-sm-3 col-form-label">City</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" id="city" name="city" placeholder=""
                                                   value="{{data.user_city if 'user_city' in data.keys() else ''}}">
                                        </div>
                                    </div>
                                    <div class="form-group row" style="margin-bottom: 0px;">
                                        <label for="phone" class=" col-sm-3 col-form-label">Phone-1</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control"  id="phone"
                                                   placeholder="Phone-1" value="{{data.user_phone if 'user_phone' in data.keys() else ''}}">
                                        </div>

                                    </div>
                                </form>
                            </div>

                <div class="row">
                    <div class="col-md-12 grid-margin stretch-card">
                        <div class="card card-box">
                            <div class="card-body">
                                <div class="template-demo custom-button">

                                    <button type="button" class="btn btn-warning btn-rounded btn-fw right-align-button register_btn">
                                        <i class="mdi mdi-checkbox-marked-circle mr-1"></i>Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

<script>
$(document).ready(function(){
    $(".btnRegister").click(function(){
    var id = document.getElementById('id').value;
    var name = document.getElementById('name').value;
    var alias = document.getElementById('alias').value;
    var address = document.getElementById('address').value;
    var city = document.getElementById('city').value;
    var phone = document.getElementById('phone').value;
    $.post('/api/hafta/customeredit_account', {'id': id, 'name': name, 'alias': alias, 'address': address, 'phone': phone,
                                        'city': city},
            function(returnedData){
            console.log(returnedData);
                if (returnedData.code == 200){
                    $('.bb').fadeToggle(200);
                    $('.message').toggleClass('comein');
                    $('.check').toggleClass('scaledown');
                    $('.register-form').hide();


                }

        }).fail(function(){
              console.log("error");
        });
  });

  $("#ok").click(function(){
    $('.register-form').show();
    $('.bb').hide();
    $('.message').hide();
    $('.check').hide();
    location.reload();
  });

  });


</script>
