<!DOCTYPE html>
<html lang="en">


<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login</title>
    <!-- plugins:css -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='template/vendors/mdi/css/materialdesignicons.min.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='template/vendors/css/vendor.bundle.base.css')}}">
    <!-- endinject -->
    <!-- Plugin css for this page -->
    <!-- End plugin css for this page -->
    <!-- inject:css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='template/css/vertical-layout-dark/style.css')}}">
    <!-- endinject -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='template/images/favicon.png')}}"/>
</head>
<style>
.btn:focus {
  background: #0066ff;
}
</style>
<body>
<div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
            <div class="row w-100">
                <div class="col-lg-4 mx-auto">
                    <div class="auth-form-light text-left p-5">
                        <div class="brand-logo">
                            <img src="{{ url_for('static', filename='template/images/praying-hands.svg')}}" alt="logo">
                        </div>
                        <div class="mt-3">
                            <label class="btn btn-block btn-dark btn-lg font-weight-medium auth-form-btn"
                                   style="font-size: xx-large; font-weight: bold;">WELCOME</label>
                        </div>
                        <br/> <br/>
                        <form class="pt-3" action="/api/user/login" method="POST">
                            <div style="color: red;">
                                {{data}}
                            </div>
                            <div class="form-group">
                                <input type="text" class="form-control form-control-lg" name="username" id="username" style="width: 100%"
                                       placeholder="Username">
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control form-control-lg" name="password" id="password" style="width: 100%"
                                       placeholder="Password">
                            </div>

                            <div class="mt-3">
                                <input type="submit" class="btn btn-block btn-success btn-lg font-weight-medium auth-form-btn btn-rounded btn-fw" value="Login">
                            </div>


                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- content-wrapper ends -->
    </div>
    <!-- page-body-wrapper ends -->
</div>
<!-- container-scroller -->
<!-- plugins:js -->
<script src="{{ url_for('static', filename='template/vendors/js/vendor.bundle.base.js')}}"></script>
<!-- endinject -->
<!-- Plugin js for this page -->
<!-- End plugin js for this page -->
<!-- inject:js -->
<script src="{{ url_for('static', filename='template/js/off-canvas.js')}}"></script>
<script src="{{ url_for('static', filename='template/js/hoverable-collapse.js')}}"></script>
<script src="{{ url_for('static', filename='template/js/template.js')}}"></script>
<script src="{{ url_for('static', filename='template/js/settings.js')}}"></script>
<script src="{{ url_for('static', filename='template/js/todolist.js')}}"></script>
<!-- endinject -->
</body>


</html>
