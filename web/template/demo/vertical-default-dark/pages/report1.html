<script>
$(document).ready(function(){
    $(".pending_date_installment_btn").click(function(){
        var date = document.getElementById("pending_installment_date_date").value;
        $.post('/api/test', {'url':'http://127.0.0.1:5000/api/report/pending_installment_by_date',
                                                            'date': date, 'doc_flag': 1},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });


  });
  $(".user_entry_btn").click(function(){

        var user_id = document.getElementById("user_entry_dropdown_select_user_id").value;
        $.post('/api/test', {'url': 'http://127.0.0.1:5000/api/report/user_entries_between_date',
                                                         'user_id': user_id, 'doc_flag': 1},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });

  $(".day_report_btn").click(function(){
        var date = document.getElementById("day_report_date").value;
        $.post('/api/test', {'url':'http://127.0.0.1:5000/api/report/day_report', 'date': date, 'doc_flag': 1},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });

  $(".user_pending_installments_btn").click(function(){
        var date = document.getElementById("user_pending_installments_date").value;
        var user_id = document.getElementById("user_pending_installment_dropdown_select_user_id").value;
        $.post('/api/test', {'url':'http://127.0.0.1:5000/api/report/user_pending_installments',
                                                        'date': date, 'user_id': user_id, 'doc_flag': 1},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });

$(".account_user_pending_installments_btn").click(function(){
        var date = document.getElementById("account_user_pending_installments_date").value;
        var from_date = document.getElementById("account_user_pending_installments_date_from").value;
        var user_id = document.getElementById("account_user_pending_installment_dropdown_select_user_id").value;
        $.post('/api/test', {'url': 'http://127.0.0.1:5000/api/report/account_user_pending_installments',
                                                        'date': date, 'user_id': user_id, 'doc_flag': 1,
                                                        'from_date': from_date},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });


  $(".general_report_btn").click(function(){

                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });
});





</script>
