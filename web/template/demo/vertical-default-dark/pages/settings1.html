        <div class="main-panel">
            <div class="content-wrapper">
                <div class="page-title-box">
                    <h2>Settings</h2>
                </div>

                <div class="row">
                    <div class="col-md-12 grid-margin stretch-card">
                        <div class="card card-box">
                            <div class="card-body">
                                <div class="template-demo custom-button setting-btn">
                                    <button type="button" class="btn btn-dark  btn-rounded btn-fw"><i
                                            class="mdi mdi-lock setting-custom-icon"></i>Set New Log In Password
                                    </button>
                                </div>
                                <form class="forms-sample custom-form">
                                    <div class="form-group row">
                                        <label for="old_password" class="col-sm-3 col-form-label">Old Password</label>
                                        <div class="col-sm-6">
                                            <input type="password" class="form-control" id="old_password"
                                                   placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="new_password" class="col-sm-3 col-form-label">New Password</label>
                                        <div class="col-sm-6">
                                            <input type="password" class="form-control" id="new_password"
                                                   placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-sm-3 "></div>
                                        <div class="col-sm-6">
                                            <button type="button"
                                                    class="btn btn-danger  btn-rounded btn-fw btnRegister">UPDATE
                                            </button>
                                        </div>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="row">
                    <div class="col-md-12 grid-margin stretch-card">
                        <div class="card card-box">
                            <div class="card-body">
                                <div class="template-demo custom-button setting-btn">
                                    <button type="button" class="btn btn-dark  btn-rounded btn-fw"><i
                                            class="mdi mdi-clock setting-custom-icon"></i>Match Time & Date
                                    </button>
                                </div>
                                <form class="forms-sample custom-form">
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-3 col-form-label">Name</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" name="name" id="name"
                                                   placeholder="Username *" value="{{data.name}}"/>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="phone" class="col-sm-3 col-form-label">Phone</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" name="phone" id="phone"
                                                   placeholder="Phone *" value="{{data.phone}}"/>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                            <label for="total_balance" class="col-sm-3 col-form-label">Total
                                                Balance</label>
                                            <div class="col-sm-6">
                                                <input type="text" class="form-control" name="total_balance"
                                                       id="total_balance" placeholder="Total Balance"
                                                       value="{{data.total_balance}}"/>
                                            </div>
                                        </div>
                                    <div class="form-group row">
                                        <label for="email" class="col-sm-3 col-form-label">Email</label>
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" name="email" id="email"
                                                   placeholder="Email *" value="{{data.email}}"/>
                                        </div>

                                        <div class="form-group row">
                                            <div class="col-sm-3 "></div>
                                            <div class="col-sm-6">
                                                <button type="button"
                                                        class="btn btn-danger btnRegister btn-rounded btn-fw">UPDATE
                                                </button>
                                            </div>
                                        </div>

                                    </div>

                                </form>

                        </div>
                    </div>

                </div>

                                    <label class="col-form-label normal-label"> Last Update on, </label>
                                    <label class="col-form-label normal-label-green"> 23:32 IST (UTC+5:30) </label>

                        </div>

<script>
$(document).ready(function(){
    $(".btnRegister").click(function(){
    var name = document.getElementById('name').value;
    var total_balance = document.getElementById('total_balance').value;
    var email = document.getElementById('email').value;
    var old_password = document.getElementById('old_password').value;
    var new_password = document.getElementById('new_password').value;
    var phone = document.getElementById('phone').value;
    $.post('/api/update_profile', {'name': name, 'phone': phone, 'total_balance': total_balance,
                                    'email': email, 'old_password': old_password, 'new_password':new_password},
            function(returnedData){
            $('.msg').hide();
            console.log(returnedData);
                if (returnedData.code == 200){
                    alert("Profile Updated");


                }
                else if (returnedData.code == 500){
                    alert("Something went wrong, Please contact develper!!");
                }

        }).fail(function(){
              console.log("error");
        });
  });

  $("#ok").click(function(){
    $('.register-form').show();
    $('.bb').hide();
    $('.message').hide();
    $('.check').hide();
    location.reload();
  });

  });



</script>
