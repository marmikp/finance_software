@import url(http://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400);
body, html {

  font-family: Source Sans Pro;

.b, .bb {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("http://i.imgur.com/kje4L5j.jpg");
  background-attachment: fixed;
  background-size: cover;
  background-position: center;
}

.bb {
  background: url("http://i.imgur.com/bDBs0et.jpg");
  background-attachment: fixed;
  background-size: cover;
  background-position: center;
  display: none;
}

#go {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translate(-50%, 0%);
  color: white;
  border: 0;
  background: #71c341;
  width: 100px;
  height: 30px;
  border-radius: 6px;
  font-size: 1rem;
  transition: background 0.2s ease;
  outline: none;
}
#go:hover {
  background: #8ecf68;
}
#go:active {
  background: #5a9f32;
}

.message {
  position: absolute;
  top: -200px;
  left: 50%;
  transform: translate(-50%, 0%);
  width: 300px;
  background: white;
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  font-weight: 300;
  color: #2c2928;
  opacity: 0;
  transition: top 0.3s cubic-bezier(0.31, 0.25, 0.5, 1.5), opacity 0.2s ease-in-out;
}
.message .check {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -50%) scale(4);
  width: 120px;
  height: 110px;
  background: #71c341;
  color: white;
  font-size: 3.8rem;
  padding-top: 10px;
  border-radius: 50%;
  opacity: 0;
  transition: transform 0.2s 0.25s cubic-bezier(0.31, 0.25, 0.5, 1.5), opacity 0.1s 0.25s ease-in-out;
}
.message .scaledown {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
.message p {
  font-size: 1.1rem;
  margin: 25px 0px;
  padding: 0;
}

  font-size: 2.3rem;

}
.message #ok {

.message #ok:hover {

}
.message #ok:active {
  background: #5a9f32;
}

<script>
$(document).ready(function(){
    $(".btnRegister").click(function(){
    var id = document.getElementById('id').value;
    var name = document.getElementById('name').value;
    var alias = document.getElementById('alias').value;
    var address = document.getElementById('address').value;
    var city = document.getElementById('city').value;
    var phone = document.getElementById('phone').value;
    var remark = document.getElementById('remark').value;
    var base_amount = document.getElementById('base_amount').value;
    var startdate = document.getElementById('startdate').value;





    $.post('/api/account/new_account_entry', {'id': id, 'name': name, 'alias': alias, 'address': address, 'phone': phone,
                                        'city': city, 'remark': remark, 'base_amount': base_amount,'startdate': startdate},
            function(returnedData){
            console.log(returnedData);
                if (returnedData.code == 200){
                    $('.bb').fadeToggle(200);
                    $('.message').toggleClass('comein');
                    $('.check').toggleClass('scaledown');
                    $('.register-form').hide();

                }

        }).fail(function(){
              console.log("error");
        });
  });

  $("#ok").click(function(){
    $('.register-form').show();
    $('.bb').hide();
    $('.message').hide();
    $('.check').hide();
    location.reload();
  });

  });


</script>
