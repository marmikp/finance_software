.b, .bb {

.message {

<script>
$(document).ready(function(){
    $(".btnRegister").click(function(){
    var id = document.getElementById('id').value;
    var name = document.getElementById('name').value;
    var alias = document.getElementById('alias').value;
    var address = document.getElementById('address').value;
    var city = document.getElementById('city').value;
    var phone = document.getElementById('phone').value;
    var phone_2 = document.getElementById('phone_2').value;
    var guarantor_1_name = document.getElementById('guarantor_1_name').value;
    var guarantor_1_phone = document.getElementById('guarantor_1_phone').value;
    var guarantor_1_address = document.getElementById('guarantor_1_address').value;
    var guarantor_2_name = document.getElementById('guarantor_2_name').value;
    var guarantor_2_phone = document.getElementById('guarantor_2_phone').value;
    var guarantor_2_address = document.getElementById('guarantor_2_address').value;
    var loan_id = document.getElementById('loan_id').value;
    $.post('/api/hafta/customeredit', {'id': id, 'loan_id': loan_id,'name': name, 'alias': alias, 'address': address, 'phone': phone,
                                        'phone_2': phone_2, 'city': city,
                                        'guarantor_1_name': guarantor_1_name, 'guarantor_1_phone': guarantor_1_phone,
                                        'guarantor_1_address': guarantor_1_address,
                                        'guarantor_2_name': guarantor_2_name,
                                        'guarantor_2_phone': guarantor_2_phone,
                                        'guarantor_2_address': guarantor_2_address},
            function(returnedData){
            console.log(returnedData);
                if (returnedData.code == 200){
                    $('.bb').fadeToggle(200);
                    $('.message').toggleClass('comein');
                    $('.check').toggleClass('scaledown');
                    $('.register-form').hide();


                }

        }).fail(function(){
              console.log("error");
        });
  });

  $("#ok").click(function(){
    $('.register-form').show();
    $('.bb').hide();
    $('.message').hide();
    $('.check').hide();
    location.reload();
  });

  });


</script>

<script>
$(document).ready(function(){
    $("#loan_id").click(function(){

    var loan_id = document.getElementById('loan_id').value;
    var user_id = document.getElementById('id').value;

    $.post('/api/get_guarantor_details_by_loan_id', {'user_id': user_id, 'loan_id': loan_id},
            function(returnedData){
            console.log(returnedData);
                if (returnedData.code == 200){
                    $('.btnRegister').show();
                    var guarantor_1_name = returnedData.data['guarantor_1_name']
                    var guarantor_1_phone = returnedData.data['guarantor_1_phone']
                    var guarantor_1_address = returnedData.data['guarantor_1_address']
                    var guarantor_2_name = returnedData.data['guarantor_2_name']
                    var guarantor_2_phone = returnedData.data['guarantor_2_phone']
                    var guarantor_2_address = returnedData.data['guarantor_2_address']
                    $('#guarantor_1_name').val(guarantor_1_name);
                    $('#guarantor_1_phone').val(guarantor_1_phone);
                    $('#guarantor_1_address').val(guarantor_1_address);
                    $('#guarantor_2_name').val(guarantor_2_name);
                    $('#guarantor_2_phone').val(guarantor_2_phone);
                    $('#guarantor_2_address').val(guarantor_2_address);

                }
                else{
                    $('.btnRegister').hide();
                }

        }).fail(function(){
              console.log("error");
        });

  });




  });


</script>
