<!DOCTYPE html>
<html>
<head>
<style>
* {
  box-sizing: border-box;
}

.row {
  margin-left:-5px;
  margin-right:-5px;
}

.column {
  float: left;
  width: 50%;
  padding: 5px;
}

/* Clearfix (clear floats) */
.row::after {
  content: "";
  clear: both;
  display: table;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
  border: 1px solid #ddd;
}

th, td {
  text-align: left;
  padding: 16px;
}

tr:nth-child(even) {
  background-color: white;
}
</style>
</head>
<body>

<h2></h2>
<p></p>

<div class="row">
  <div class="column">
      <h1></h1>
    {{data.table1}}
  </div>
  <div class="column">
      <h1></h1>
    {{data.table2}}
  </div>
</div>

</body>
</html>
