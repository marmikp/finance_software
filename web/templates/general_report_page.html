<!DOCTYPE html>
<html>
<head>
    <link href="{{ url_for('static', filename='assets/css/bootstrap.min.css')}}" rel="stylesheet" />
    <script src="{{ url_for('static', filename='assets/js/jquery-3.2.1.min.js')}}"></script>
    <script src="{{ url_for('static', filename='assets/js/bootstrap.min.js')}}"></script>
    <style>
* {
  box-sizing: border-box;
}

.row {
  margin-left:-5px;
  margin-right:-5px;
}

.column {
  float: left;
  width: 50%;
  padding: 5px;
}

/* Clearfix (clear floats) */
.row::after {
  content: "";
  clear: both;
  display: table;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
  border: 1px solid #ddd;
  font-weight: 500;
}

th, td {
  text-align: left;
  padding: 16px;
}

tr:nth-child(even) {
  background-color: white;
}

.dataframe {
    background-color: white;
}
table {
background-color: white;
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  text-align: right;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
  height:100%;
  width: auto;
}
td:empty::after{
  content: "\00a0";
}

.number_column {
    width: 100px;
}

.pdf-page {
            font-family: "DejaVu Sans", "Arial", sans-serif;
        }

    </style>
</head>
<body>

<h2></h2>
<p></p>

<div class="row">
    <div class="column">
        <h1></h1>
        <table>
            {{data.table1}}
        </table>
    </div>
    <div class="column">
        <h1></h1>
        <table>
            {{data.table2}}
        </table>
    </div>
</div>

</body>
</html>
