<!DOCTYPE html>
<html>
<head>
    <link href="{{ url_for('static', filename='assets/css/bootstrap.min.css')}}" rel="stylesheet" />
    <script src="{{ url_for('static', filename='assets/js/jquery-3.2.1.min.js')}}"></script>
    <script src="{{ url_for('static', filename='assets/js/bootstrap.min.js')}}"></script>
    <script src="{{ url_for('static', filename='assets/js/jquery.min.js')}}" type="text/javascript"></script>
<script src="{{ url_for('static', filename='assets/js/jquery.dataTables.min.js')}}" type="text/javascript"></script>
    <style>
* {
  box-sizing: border-box;
}

.row {
  margin-left:-5px;
  margin-right:-5px;
}

.column {
  float: left;
  width: 50%;
  padding: 5px;
}

/* Clearfix (clear floats) */
.row::after {
  content: "";
  clear: both;
  display: table;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
  width: 100%;
  border: 1px solid #ddd;
  font-weight: 500;
}

th, td {
  text-align: left;
  padding: 16px;
}

tr:nth-child(even) {
  background-color: white;
}

.dataframe {
    background-color: white;
}
table {
background-color: white;
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  text-align: right;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
  height:100%;
  width: auto;
}
td:empty::after{
  content: "\00a0";
}

.number_column {
    width: 100px;
}

.pdf-page {
            font-family: "DejaVu Sans", "Arial", sans-serif;
        }

table.dataTable th.focus,
table.dataTable td.focus {
  outline: none;
}

    </style>

<script>
    $(document).ready(function (){
    var table = $('#example').DataTable({
        ajax: 'https://gyrocode.github.io/files/jquery-datatables/arrays.json',
        select: {
            style: 'single'
        },
        keys: {
           keys: [ 13 /* ENTER */, 38 /* UP */, 40 /* DOWN */ ]
        }
    });

    // Handle event when cell gains focus
    $('#example').on('key-focus.dt', function(e, datatable, cell){
        // Select highlighted row
        table.row(cell.index().row).select();
    });

    // Handle click on table cell
    $('#example').on('click', 'tbody td', function(e){
        e.stopPropagation();

        // Get index of the clicked row
        var rowIdx = table.cell(this).index().row;

        // Select row
        table.row(rowIdx).select();
    });

    // Handle key event that hasn't been handled by KeyTable
    $('#example').on('key.dt', function(e, datatable, key, cell, originalEvent){
        // If ENTER key is pressed
        if(key === 13){
            // Get highlighted row data
            var data = table.row(cell.index().row).data();

            // FOR DEMONSTRATION ONLY
            $("#example-console").html(data.join(', '));
        }
    });
});
</script>
</head>
<body>

<h2></h2>
<p></p>

<div class="row">
    <div class="column">
        <h1></h1>
        <table id="example" class="display" cellspacing="0" width="100%">
            {{data.table1}}
        </table>
    </div>
    <div class="column">
        <h1></h1>
        <table id="example" class="display" cellspacing="0" width="100%">
            {{data.table2}}
        </table>
    </div>
</div>

</body>
</html>
