<script>
$(document).ready(function(){
    $(".pending_date_installment_btn").click(function(){
        var date = document.getElementById("pending_installment_date_date").value;
        $.post('/api/test', {'url':'http://127.0.0.1:5000/api/report/pending_installment_by_date',
                                                            'date': date},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });


  });
  $(".user_entry_btn").click(function(){
        var from_date = document.getElementById("user_entry_from_date").value;
        var to_date = document.getElementById("user_entry_to_date").value;
        var user_id = document.getElementById("user_entry_dropdown_select_user_id").value;
        $.post('/api/test', {'url': 'http://127.0.0.1:5000/api/report/user_entries_between_date',
                                                         'user_id': user_id, 'from_date': from_date, 'to_date': to_date},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });

  $(".day_report_btn").click(function(){
        var date = document.getElementById("day_report_date").value;
        $.post('/api/test', {'url':'http://127.0.0.1:5000/api/report/day_report', 'date': date},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });

  $(".user_pending_installments_btn").click(function(){
        var date = document.getElementById("user_pending_installments_date").value;
        var user_id = document.getElementById("user_pending_installment_dropdown_select_user_id").value;
        $.post('/api/test', {'url':'http://127.0.0.1:5000/api/report/user_pending_installments',
                                                        'date': date, 'user_id': user_id},
                function(returnedData){
                    var w = window.open('about:blank');
                    w.document.open();
                    w.document.write(returnedData);
                    w.document.close();
            }).fail(function(){
                  console.log("error");
            });
  });
});
</script>

<style>
    .top-buffer { margin-top:20px; }
</style>

<div style="padding: 50px">
  <div class="row">
    <h2>Reports</h2>
  </div>


    <div class="row align-items-center" style="background-color: white; border-radius: 10px">
      <div class="col-md-6" align="left">
        <div><h4>Pending Installment by date</h4></div>
      </div>

      <div class="col-md-3">
          <h4>To: </h4>
          <input type="date" id="pending_installment_date_date">
      </div>


      <div class="col-md-3">
        <input type="button" class="pending_date_installment_btn btn btn-primary" value="Get report">
      </div>
    </div>

    <div class="row align-items-center top-buffer" style="background-color: white; border-radius: 10px">
      <div class="col-md-3" align="left">
          <div><h4>User Entries</h4></div>
      </div>

      <div class="col-md-3">
           <h4>Cutomer: </h4>
            <select class="form-select" id="user_entry_dropdown_select_user_id">
                {% for d in data %}
                    <option value="{{d.id}}">{{d.id}}&ensp;-&ensp;{{d.user_name}}</option>
                {% endfor %}
            </select>
      </div>
      <div class="col-md-3">
            <h4>From: </h4>
            <input type="date" id="user_entry_from_date">
            <h4>To: </h4>
            <input type="date" id="user_entry_to_date">
      </div>
      <div class="col-md-3">
        <div><input type="button" class="user_entry_btn btn btn-primary" value="Get report"></div>
      </div>
    </div>

    <div class="row align-items-center top-buffer" style="background-color: white; border-radius: 10px">
      <div class="col-md-3" align="left">
        <div><h4>Day Report</h4></div>
      </div>
        <div class="col-md-3">
      </div>
      <div class="col-md-3">
            <h4>Date: </h4>
            <input type="date" id="day_report_date">
      </div>

      <div class="col-md-3">
        <div><input type="button" class="day_report_btn btn btn-primary" value="Get report"></div>
      </div>
    </div>

    <div class="row align-items-center top-buffer" style="background-color: white; border-radius: 10px">
      <div class="col-md-3" align="left">
          <div><h4>User Pending Installments</h4></div>
      </div>
      <div class="col-md-3">

            <h4>Cutomer: </h4>

        <select class="form-select" id="user_pending_installment_dropdown_select_user_id">
            {% for d in data %}
                <option value="{{d.id}}">{{d.id}}&ensp;-&ensp;{{d.user_name}}</option>
            {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
            <h4>To: </h4>
            <input type="date" id="user_pending_installments_date">
      </div>
      <div class="col-md-3">
        <div><input type="button" class="user_pending_installments_btn btn btn-primary" value="Get report"></div>
      </div>
    </div>

</div>
