body, html {

.b, .bb {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("http://i.imgur.com/kje4L5j.jpg");
  background-attachment: fixed;
  background-size: cover;
  background-position: center;
}

.bb {
  background: url("http://i.imgur.com/bDBs0et.jpg");
  background-attachment: fixed;
  background-size: cover;
  background-position: center;
  display: none;
}

#go {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translate(-50%, 0%);
  color: white;
  border: 0;
  background: #71c341;
  width: 100px;
  height: 30px;
  border-radius: 6px;
  font-size: 1rem;
  transition: background 0.2s ease;
  outline: none;
}
#go:hover {
  background: #8ecf68;
}
#go:active {
  background: #5a9f32;
}

.message {
  position: absolute;
  top: -200px;
  left: 50%;
  transform: translate(-50%, 0%);
  width: 300px;
  background: white;
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  font-weight: 300;
  color: #2c2928;
  opacity: 0;
  transition: top 0.3s cubic-bezier(0.31, 0.25, 0.5, 1.5), opacity 0.2s ease-in-out;
}
.message .check {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -50%) scale(4);
  width: 120px;
  height: 110px;
  background: #71c341;
  color: white;
  font-size: 3.8rem;
  padding-top: 10px;
  border-radius: 50%;
  opacity: 0;
  transition: transform 0.2s 0.25s cubic-bezier(0.31, 0.25, 0.5, 1.5), opacity 0.1s 0.25s ease-in-out;
}
.message .scaledown {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
.message p {
  font-size: 1.1rem;
  margin: 25px 0px;
  padding: 0;
}
.message p:nth-child(2) {
  font-size: 2.3rem;
  margin: 40px 0px 0px 0px;
}
.message #ok {
  position: relative;
  color: white;
  border: 0;
  background: #71c341;
  width: 100%;
  height: 50px;
  border-radius: 6px;
  font-size: 1.2rem;
  transition: background 0.2s ease;
  outline: none;
}
.message #ok:hover {
  background: #8ecf68;
}
.message #ok:active {
  background: #5a9f32;
}

.comein {
  top: 150px;
  opacity: 1;
}

<script>
$(document).ready(function(){
    $(".btnRegister").click(function(){
        var after_apply=$('.total_amount').val()-$('.base_amount').val();
        if (after_apply < 0){
            alert("Amount should be less");
        }
          else{
            var id = document.getElementById('id').value;
            var name = document.getElementById('name').value;
            var alias = document.getElementById('alias').value;
            var address = document.getElementById('address').value;
            var city = document.getElementById('city').value;
            var phone = document.getElementById('phone').value;
            var phone_2 = document.getElementById('phone_2').value;

            var loan_type = document.getElementById('loan_type').value;
            var guarantor_1_phone = document.getElementById('guarantor_1_phone').value;
            var guarantor_1_name = document.getElementById('guarantor_1_name').value;
            var guarantor_1_address = document.getElementById('guarantor_1_address').value;
            var remark = document.getElementById('remark').value;
            var base_amount = document.getElementById('base_amount').value;
            var interest = document.getElementById('interest').value;

            var noi = document.getElementById('noi').value;
            var startdate = document.getElementById('startdate').value;
            var period = document.getElementById('period').value;
            var paid_amount = document.getElementById('paid_amount').value;
            var guarantor_2_name = document.getElementById('guarantor_2_name').value;
            var guarantor_2_address = document.getElementById('guarantor_2_address').value;
            var guarantor_2_phone = document.getElementById('guarantor_2_phone').value;


            $.post('/api/hafta/new_hafta_entry', {'id': id, 'name': name, 'alias': alias, 'address': address, 'phone': phone,
                                                'phone_2': phone_2, 'city': city, 'loan_type': loan_type, 'guarantor_1_phone': guarantor_1_phone,
                                                'guarantor_1_name': guarantor_1_name, 'guarantor_1_address': guarantor_1_address,
                                                'remark': remark, 'base_amount': base_amount, 'interest': interest, 'noi': noi, 'startdate': startdate,
                                                'period': period, 'paid_amount': paid_amount, 'guarantor_2_name': guarantor_2_name, 'guarantor_2_address': guarantor_2_address,
                                                'guarantor_2_phone': guarantor_2_phone},
                    function(returnedData){
                    console.log(returnedData);
                        if (returnedData.code == 200){
                            $('.bb').fadeToggle(200);
                            $('.message').toggleClass('comein');
                            $('.check').toggleClass('scaledown');
                            $('.register-form').hide();


                        }

                }).fail(function(){
                      console.log("error");
                });
            }
  });






  $("#ok").click(function(){
    $('.register-form').show();
    $('.bb').hide();
    $('.message').hide();
    $('.check').hide();
    location.reload();
  });

  });


</script>
<script>
function validate() {
  var after_apply=$('.total_amount').val()-$('.base_amount').val();
  if (after_apply < 0){
    alert("Amount should be less");
  }
}
</script>
